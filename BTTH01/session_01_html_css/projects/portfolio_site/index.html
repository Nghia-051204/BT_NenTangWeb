<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/skills.css">
    <link rel="stylesheet" href="css/portfolio.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
    <header>
        <div class="logo">Dương Minh Nghĩa</div>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburger">&#9776;</label>
        <nav>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#portfolio">Portfolio</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main id="main-content">
        <section class="hero" id="hero">
            <h1>Hi, I'm Dương Minh Nghĩa</h1>
            <p>Full-Stack Developer | UI Designer</p>
            <a href="#portfolio" class="cta-button">View My Work</a>
        </section>
        <section id="about" class="about-section" style="padding: 5rem 0;">
            <div class="container about-grid">
                <div class="about-image"><img src="https://media.istockphoto.com/id/1300845620/vector/user-icon-flat-isolated-on-white-background-user-symbol-vector-illustration.jpg?s=612x612&w=0&k=20&c=yBeyba0hUkh14_jgv1OKqIH0CCSWU_4ckRkAoy2p73o=" alt="Profile"></div>
                <div class="about-content">
                    <h2>About Me</h2>
                    <p class="lead">I'm a developer with a passion for creating beautiful and functional web applications.</p>
                </div>
            </div>
        </section>
        <section id="skills" style="padding: 5rem 0; background: #fff;">
            <div class="container">
                <h2>My Skills</h2>
                <div class="skills-grid">
                    <div class="skill-item">
                        <span>HTML5</span>
                        <div class="skill-bar"><div class="skill-progress" style="width: 95%"></div></div>
                    </div>
                </div>
            </div>
        </section>
        <section id="portfolio" style="padding: 5rem 0;">
            <div class="container">
                <h2>Portfolio</h2>
                <div class="portfolio-grid">
                    <div class="portfolio-item">
                        <a href="#lightbox-1">
                            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1200&auto=format&fit=crop" alt="Project">
                            <div class="portfolio-overlay"><h3>Web App</h3></div>
                        </a>
                    </div>
                </div>
            </div>
            <div id="lightbox-1" class="lightbox">
                <img src="https://via.placeholder.com/800x600" alt="Large">
                <a href="#portfolio" class="lightbox-close">&times;</a>
            </div>
        </section>
    </main>
</body>
</html>
