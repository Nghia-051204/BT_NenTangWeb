<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-main">
                <h1>Danh bạ Thành viên</h1>
                <button id="openCreateModalBtn" class="btn btn-primary">+ Thêm thành viên</button>
            </div>
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Tìm kiếm nhanh theo tên hoặc email..." autocomplete="off">
            </div>
        </header>

        <main class="app-content">
            <div id="userGrid" class="user-grid">
                </div>
        </main>
    </div>

    <div id="userModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Thêm thành viên mới</h3>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>
            <form id="userForm" class="modal-form">
                <input type="hidden" id="userIdField">
                <div class="form-group">
                    <label for="userName">Họ và tên</label>
                    <input type="text" id="userName" required placeholder="Nhập họ tên đầy đủ">
                </div>
                <div class="form-group">
                    <label for="userEmail">Địa chỉ Email</label>
                    <input type="email" id="userEmail" required placeholder="username@example.com">
                </div>
                <div class="form-group">
                    <label for="userPhone">Số điện thoại</label>
                    <input type="text" id="userPhone" required placeholder="Nhập số điện thoại">
                </div>
                <div class="form-group">
                    <label for="userCompany">Công ty</label>
                    <input type="text" id="userCompany" required placeholder="Tên cơ quan / tổ chức">
                </div>
                <div class="form-actions">
                    <button type="button" id="cancelModalBtn" class="btn btn-secondary">Hủy</button>
                    <button type="submit" id="submitFormBtn" class="btn btn-primary">Lưu lại</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
