<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallel Async Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="globalLoader" class="global-loader">
        <div class="loader-content">
            <div class="spinner"></div>
            <p>Đang đồng bộ hóa tất cả dữ liệu hệ thống...</p>
        </div>
    </div>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="header-title">
                <h1>Hệ Thống Giám Sát Tổng Hợp</h1>
                <p id="executionTime" class="execution-time">Vui lòng chờ, dữ liệu đang khởi động...</p>
            </div>
            <button id="refreshBtn" class="btn btn-refresh">🔄 Tải lại toàn bộ</button>
        </header>

        <main class="dashboard-grid">
            <section class="widget-card" id="widget-0">
                <div class="widget-header">
                    <h2>🌤️ Thời Tiết Hà Nội</h2>
                </div>
                <div class="widget-body"></div>
            </section>

            <section class="widget-card" id="widget-1">
                <div class="widget-header">
                    <h2>📝 Tin Tức Cộng Đồng</h2>
                </div>
                <div class="widget-body"></div>
            </section>

            <section class="widget-card" id="widget-2">
                <div class="widget-header">
                    <h2>🐶 Thú Cưng Ngẫu Nhiên</h2>
                </div>
                <div class="widget-body"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
