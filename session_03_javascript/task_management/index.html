<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Quản lý công việc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Toast notification -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- App wrapper -->
  <div class="app-wrapper">

    <!-- Header -->
    <header class="app-header">
      <div class="header-inner">
        <div class="logo-block">
          <span class="logo-icon">⬡</span>
          <h1 class="app-title">TaskFlow</h1>
        </div>
        <button id="btn-open-form" class="btn-add" aria-label="Thêm công việc mới">
          <span class="btn-add-icon">+</span>
          <span>Thêm công việc</span>
        </button>
      </div>
    </header>

    <!-- Stats bar -->
    <section class="stats-bar" aria-label="Thống kê công việc">
      <div class="stat-card">
        <span class="stat-label">Tổng cộng</span>
        <span class="stat-value" id="stat-total">0</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card accent-done">
        <span class="stat-label">Hoàn thành</span>
        <span class="stat-value" id="stat-done">0</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card accent-pending">
        <span class="stat-label">Chưa xong</span>
        <span class="stat-value" id="stat-pending">0</span>
      </div>
    </section>

    <!-- Task list -->
    <main class="task-area">
      <div id="task-list" class="task-list" role="list"></div>
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon">◎</div>
        <p class="empty-title">Chưa có công việc nào</p>
        <p class="empty-sub">Nhấn <strong>Thêm công việc</strong> để bắt đầu.</p>
      </div>
    </main>

  </div>

  <!-- Overlay -->
  <div id="overlay" class="overlay" aria-hidden="true"></div>

  <!-- Popup form -->
  <dialog id="task-dialog" class="task-dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog-header">
      <h2 id="dialog-title">Thêm công việc</h2>
      <button id="btn-close-form" class="btn-close" aria-label="Đóng form">✕</button>
    </div>

    <form id="task-form" novalidate autocomplete="off">
      <input type="hidden" id="edit-id" />

      <!-- Tiêu đề -->
      <div class="form-group" id="group-title">
        <label for="field-title">
          Tiêu đề <span class="required">*</span>
        </label>
        <div class="input-wrap">
          <input
            type="text"
            id="field-title"
            placeholder="VD: Hoàn thành báo cáo tuần"
            maxlength="100"
          />
          <span class="input-icon" id="icon-title"></span>
        </div>
        <div class="field-footer">
          <span class="field-error" id="err-title" role="alert"></span>
          <span class="char-count" id="count-title">0 / 100</span>
        </div>
      </div>

      <!-- Mô tả -->
      <div class="form-group" id="group-desc">
        <label for="field-desc">Mô tả ngắn</label>
        <div class="input-wrap">
          <textarea
            id="field-desc"
            placeholder="Thêm ghi chú hoặc mô tả chi tiết…"
            rows="3"
            maxlength="300"
          ></textarea>
        </div>
        <div class="field-footer">
          <span class="field-error" id="err-desc" role="alert"></span>
          <span class="char-count" id="count-desc">0 / 300</span>
        </div>
      </div>

      <!-- Hạn + Ưu tiên -->
      <div class="form-row">
        <div class="form-group" id="group-due">
          <label for="field-due">Hạn hoàn thành</label>
          <div class="input-wrap">
            <input type="date" id="field-due" />
            <span class="input-icon" id="icon-due"></span>
          </div>
          <div class="field-footer">
            <span class="field-error" id="err-due" role="alert"></span>
            <span class="field-hint" id="hint-due"></span>
          </div>
        </div>

        <div class="form-group" id="group-priority">
          <label for="field-priority">Mức ưu tiên <span class="required">*</span></label>
          <div class="input-wrap">
            <select id="field-priority">
              <option value="">— Chọn mức ưu tiên —</option>
              <option value="low">🟢 Thấp</option>
              <option value="medium">🟡 Trung bình</option>
              <option value="high">🔴 Cao</option>
            </select>
            <span class="input-icon" id="icon-priority"></span>
          </div>
          <div class="field-footer">
            <span class="field-error" id="err-priority" role="alert"></span>
          </div>
        </div>
      </div>

      <div class="dialog-actions">
        <button type="button" id="btn-cancel" class="btn-secondary">Hủy</button>
        <button type="submit" id="btn-submit" class="btn-primary">
          <span id="btn-submit-text">Lưu công việc</span>
        </button>
      </div>
    </form>
  </dialog>

  <!-- Delete confirmation dialog -->
  <dialog id="confirm-dialog" class="confirm-dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-icon">⚠</div>
    <h3 id="confirm-title">Xác nhận xóa</h3>
    <p id="confirm-msg">Bạn có chắc muốn xóa công việc này không?</p>
    <div class="dialog-actions">
      <button id="btn-confirm-cancel" class="btn-secondary">Hủy</button>
      <button id="btn-confirm-ok" class="btn-danger">Xóa</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
